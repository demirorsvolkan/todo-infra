apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-alerts
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/demirorsvolkan/todo-infra.git
    targetRevision: main
    path: monitoring/alerts

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true