apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: teams-alerts
  namespace: todo-app
  labels:
    alertmanagerConfig: teams

spec:
  route:
    receiver: teams-webhook
    groupBy:
      - alertname
      - namespace
      - component
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: teams-webhook
      msteamsv2Configs:
        - webhookURL:
            name: teams-webhook
            key: webhook-url

          title: '🚨 {{ .CommonLabels.alertname }}'

          text: |
            **Durum:** {{ .Status | toUpper }}
            **Severity:** {{ .CommonLabels.severity }}

            **Servis:** {{ .CommonLabels.component }}
            **Namespace:** {{ .CommonLabels.namespace }}
            **Pod:** {{ .CommonLabels.pod }}

            **Açıklama:** {{ .CommonAnnotations.description }}

          sendResolved: true