apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: postgresql-memory-alerts
  namespace: monitoring
  labels:
    release: prometheus

spec:
  groups:
    - name: postgresql-memory
      rules:

        - alert: PostgreSQLMemoryNotice
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="postgres"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="postgres",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 65
          for: 5m
          labels:
            severity: notice
            component: postgresql
          annotations:
            summary: "PostgreSQL memory usage above 65%"
            description: "PostgreSQL pod {{ $labels.pod }} is using more than 65% of its memory limit."

        - alert: PostgreSQLMemoryWarning
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="postgres"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="postgres",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 75
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL memory usage above 75%"
            description: "PostgreSQL pod {{ $labels.pod }} is using more than 75% of its memory limit."

        - alert: PostgreSQLMemoryCritical
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="postgres"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="postgres",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 85
          for: 2m
          labels:
            severity: critical
            component: postgresql
          annotations:
            summary: "PostgreSQL memory usage above 85%"
            description: "PostgreSQL pod {{ $labels.pod }} is using more than 85% of its memory limit."

        - alert: PostgreSQLMemoryEmergency
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="postgres"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="postgres",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 95
          for: 1m
          labels:
            severity: emergency
            component: postgresql
          annotations:
            summary: "PostgreSQL memory usage above 95%"
            description: "PostgreSQL pod {{ $labels.pod }} is using more than 95% of its memory limit."