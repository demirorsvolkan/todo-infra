apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: frontend-memory-alerts
  namespace: monitoring
  labels:
    release: prometheus-kube-prometheus

spec:
  groups:
    - name: frontend-memory
      rules:

        - alert: FrontendMemoryNotice
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="frontend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="frontend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 65
          for: 5m
          labels:
            severity: notice
            component: frontend
          annotations:
            summary: "Frontend memory usage above 65%"
            description: "Frontend pod {{ $labels.pod }} is using more than 65% of its memory limit."

        - alert: FrontendMemoryWarning
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="frontend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="frontend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 75
          for: 5m
          labels:
            severity: warning
            component: frontend
          annotations:
            summary: "Frontend memory usage above 75%"
            description: "Frontend pod {{ $labels.pod }} is using more than 75% of its memory limit."

        - alert: FrontendMemoryCritical
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="frontend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="frontend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 85
          for: 2m
          labels:
            severity: critical
            component: frontend
          annotations:
            summary: "Frontend memory usage above 85%"
            description: "Frontend pod {{ $labels.pod }} is using more than 85% of its memory limit."

        - alert: FrontendMemoryEmergency
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="frontend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="frontend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 95
          for: 1m
          labels:
            severity: emergency
            component: frontend
          annotations:
            summary: "Frontend memory usage above 95%"
            description: "Frontend pod {{ $labels.pod }} is using more than 95% of its memory limit."