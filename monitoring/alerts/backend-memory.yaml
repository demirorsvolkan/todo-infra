apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: backend-memory-alerts
  namespace: monitoring
  labels:
    release: prometheus-kube-prometheus

spec:
  groups:
    - name: backend-memory
      rules:

        - alert: BackendMemoryNotice
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              /
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 65
          for: 5m
          labels:
            severity: notice
            component: backend
          annotations:
            summary: "Backend memory usage above 65%"
            description: "Backend pod {{ $labels.pod }} is using more than 65% of its memory limit."

        - alert: BackendMemoryWarning
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              /
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 75
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "Backend memory usage above 75%"
            description: "Backend pod {{ $labels.pod }} is using more than 75% of its memory limit."

        - alert: BackendMemoryCritical
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              /
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 85
          for: 5m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "Backend memory usage above 85%"
            description: "Backend pod {{ $labels.pod }} is using more than 85% of its memory limit."

        - alert: BackendMemoryEmergency
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              /
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 95
          for: 5m
          labels:
            severity: emergency
            component: backend
          annotations:
            summary: "Backend memory usage above 95%"
            description: "Backend pod {{ $labels.pod }} is using more than 95% of its memory limit."
