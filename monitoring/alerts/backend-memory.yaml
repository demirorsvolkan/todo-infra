apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: backend-memory-alerts
  namespace: monitoring
  labels:
    release: prometheus

spec:
  groups:
    - name: backend-memory
      rules:

        - alert: BackendMemoryNotice
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 65 and
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 <= 75
          for: 5m
          labels:
            severity: notice
            component: backend
            alert_source: todo-app
          annotations:
            summary: "Backend memory usage above 65%"
            description: "Backend memory usage exceeded 65% of its memory limit."
            memory_usage: '{{ printf "%.1f" $value }}%'

        - alert: BackendMemoryWarning
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 75 and
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 <= 85
          for: 5m
          labels:
            severity: warning
            component: backend
            alert_source: todo-app
          annotations:
            summary: "Backend memory usage above 75%"
            description: "Backend memory usage exceeded 75% of its memory limit."
            memory_usage: '{{ printf "%.1f" $value }}%'

        - alert: BackendMemoryCritical
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 85 and
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 <= 95
          for: 2m
          labels:
            severity: critical
            component: backend
            alert_source: todo-app
          annotations:
            summary: "Backend memory usage above 85%"
            description: "Backend memory usage exceeded 85% of its memory limit."
            memory_usage: '{{ printf "%.1f" $value }}%'

        - alert: BackendMemoryEmergency
          expr: |
            (
              container_memory_working_set_bytes{
                namespace="todo-app",
                container="backend"
              }
              / on(namespace,pod,container)
              kube_pod_container_resource_limits{
                namespace="todo-app",
                container="backend",
                resource="memory",
                unit="byte"
              }
            ) * 100 > 95
          for: 1m
          labels:
            severity: emergency
            component: backend
            alert_source: todo-app
          annotations:
            summary: "Backend memory usage above 95%"
            description: "Backend memory usage exceeded 95% of its memory limit."
            memory_usage: '{{ printf "%.1f" $value }}%'
